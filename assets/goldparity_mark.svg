<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bullionGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D18A" />
      <stop offset="50%" stop-color="#D8A84E" />
      <stop offset="100%" stop-color="#A3751E" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111821" />
      <stop offset="100%" stop-color="#080B10" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Bullion Emblem Border -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="url(#darkBg)" stroke="url(#bullionGold)" stroke-width="2.5" />

  <!-- Monogram G and P Structure with Rising Candlestick Dynamics -->
  <g filter="url(#goldGlow)">
    <!-- Outer 'G' Arc -->
    <path d="M 62,24 C 40,18 20,28 20,50 C 20,72 40,82 64,78 C 76,76 82,68 82,56 L 56,56" 
          fill="none" stroke="url(#bullionGold)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- 'P' Stem and Loop -->
    <path d="M 42,30 L 42,72 M 42,30 L 60,30 C 69,30 73,35 73,43 C 73,51 68,54 42,54" 
          fill="none" stroke="url(#bullionGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Rising Candlestick Motif inside the Core -->
    <line x1="30" y1="44" x2="30" y2="58" stroke="url(#bullionGold)" stroke-width="1.5" />
    <rect x="28.5" y="47" width="3" height="7" fill="url(#bullionGold)" rx="0.5" />

    <line x1="35" y1="38" x2="35" y2="54" stroke="url(#bullionGold)" stroke-width="1.5" />
    <rect x="33.5" y="41" width="3" height="8" fill="url(#bullionGold)" rx="0.5" />

    <line x1="54" y1="22" x2="54" y2="38" stroke="#F4D18A" stroke-width="1.5" />
    <rect x="52.5" y="25" width="3" height="8" fill="#F4D18A" rx="0.5" />
  </g>
</svg>
